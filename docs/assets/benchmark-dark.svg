        <rect x="0" y="38" width="275" height="10" rx="3.5" fill="#4B5563"/>
        <text x="325" y="47" fill="#8A8DA8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">24.47%</text>
