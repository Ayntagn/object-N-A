        <text x="392" y="12.5" text-anchor="middle" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600">-44.5%</text>

        <rect x="0" y="21" width="315" height="12" rx="4" fill="#1C2026"/>
        <rect x="0" y="21" width="146" height="12" rx="4" fill="url(#bar-accent-d)"/>
