<svg xmlns="http://www.w3.org/2000/svg" width="960" height="352" viewBox="0 0 960 352" role="img" aria-label="object-N/A v0.4.0 vs Obsidian 1.15.1 Performance Benchmark">
  <defs>
    <linearGradient id="bg-d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10141A"/>
      <stop offset="100%" stop-color="#181C22"/>
    </linearGradient>
    <linearGradient id="bar-accent-d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A9C7FF"/>
    </linearGradient>
    <linearGradient id="top-rule-d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A9C7FF" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#FFAAF7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFC46B" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card-d">
      <rect x="0.5" y="0.5" width="959" height="351" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card-d)">
    <rect width="960" height="352" fill="url(#bg-d)"/>
