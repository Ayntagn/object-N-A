      <g transform="translate(0, 32)">
        <text x="0" y="12" fill="#C4C6D0" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="12">空闲平均 CPU</text>
