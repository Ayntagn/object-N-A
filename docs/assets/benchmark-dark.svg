        <text x="16" y="22" fill="#8A8DA8" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="11">内存占用下降</text>
        <text x="16" y="41" fill="#A9C7FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">~32% 更轻</text>

        <line x1="196" y1="12" x2="196" y2="40" stroke="#45474B" stroke-opacity="0.6" stroke-width="1"/>

        <text x="216" y="22" fill="#8A8DA8" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="11">CPU 占用下降</text>
        <text x="216" y="41" fill="#FFC46B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">26.8% – 44.5%</text>
