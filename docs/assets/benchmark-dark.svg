      <text x="0" y="38" fill="#F1F3F9" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="600">object-N/A v0.4.0 vs. Obsidian 1.15.1</text>
      <text x="0" y="57" fill="#8A8DA8" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="12">Apple M5 · 24 GiB · macOS 27.0.1 · 三组交替运行中位数（数值越低越好）</text>

      <!-- Legend -->
      <g transform="translate(604, 16)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">
        <rect x="0" y="0" width="144" height="28" rx="7" fill="#1C2026" stroke="#A9C7FF" stroke-opacity="0.4" stroke-width="1"/>
        <circle cx="15" cy="14" r="4.5" fill="#A9C7FF"/>
        <text x="27" y="18" fill="#E3E2E6" font-weight="600">object-N/A v0.4.0</text>

        <rect x="154" y="0" width="138" height="28" rx="7" fill="#1C2026" stroke="#45474B" stroke-opacity="0.7" stroke-width="1"/>
