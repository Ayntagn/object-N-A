        <rect x="364" y="0" width="56" height="18" rx="9" fill="#10B981" fill-opacity="0.16" stroke="#34D399" stroke-opacity="0.4" stroke-width="0.8"/>
        <text x="392" y="12.5" text-anchor="middle" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600">-26.8%</text>

        <rect x="0" y="21" width="315" height="12" rx="4" fill="#1C2026"/>
        <rect x="0" y="21" width="201" height="12" rx="4" fill="url(#bar-accent-d)"/>
        <text x="325" y="31" fill="#A9C7FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600">17.90%</text>

